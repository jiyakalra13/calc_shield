<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>iMessage - Live Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Leaflet.js Map Assets -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-tint": "#ffb868",
                    "secondary-container": "#474649",
                    "primary-fixed": "#ffddbb",
                    "on-primary": "#482900",
                    "secondary-fixed-dim": "#c8c6c8",
                    "on-secondary-fixed": "#1b1b1d",
                    "inverse-on-surface": "#2f3131",
                    "outline": "#a28d79",
                    "surface-container-lowest": "#0d0e0f",
                    "on-tertiary-fixed-variant": "#474649",
                    "primary-fixed-dim": "#ffb868",
                    "secondary-fixed": "#e4e2e4",
                    "surface-bright": "#383939",
                    "on-error": "#690005",
                    "on-tertiary-container": "#464648",
                    "surface-container": "#1e2020",
                    "on-background": "#e3e2e2",
                    "surface": "#121414",
                    "surface-container-highest": "#343535",
                    "on-surface": "#e3e2e2",
                    "error-container": "#93000a",
                    "surface-container-low": "#1a1c1c",
                    "error": "#ffb4ab",
                    "tertiary-container": "#b6b4b6",
                    "on-primary-fixed-variant": "#673d00",
                    "tertiary-fixed": "#e4e2e4",
                    "on-secondary-container": "#b6b4b7",
                    "on-surface-variant": "#dac3ad",
                    "secondary": "#c8c6c8",
                    "primary": "#ffc688",
                    "inverse-surface": "#e3e2e2",
                    "on-error-container": "#ffdad6",
                    "outline-variant": "#544433",
                    "tertiary": "#d2d0d2",
                    "on-secondary": "#303032",
                    "on-primary-fixed": "#2b1700",
                    "inverse-primary": "#885200",
                    "primary-container": "#ff9f0a",
                    "background": "#121414",
                    "on-tertiary-fixed": "#1b1b1d",
                    "surface-container-high": "#292a2a",
                    "on-tertiary": "#303032",
                    "on-secondary-fixed-variant": "#474649",
                    "tertiary-fixed-dim": "#c8c6c8",
                    "surface-variant": "#343535",
                    "on-primary-container": "#673d00",
                    "surface-dim": "#121414"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            }
          }
        }
      }
    </script>
    <style>
        body { background-color: #000000; color: #ffffff; -webkit-font-smoothing: antialiased; user-select: none; }
        .phone-frame {
            width: 393px;
            height: 852px;
            background: #000;
            border-radius: 54px;
            position: relative;
            box-shadow: 0 0 0 11px #1f1f1f, 0 0 0 13px #333, 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin: auto;
        }
        .dynamic-island {
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
        .message-bubble { position: relative; border-radius: 20px; padding: 12px 16px; max-width: 75%; font-family: 'Inter', sans-serif; word-wrap: break-word; }
        .bubble-right { background-color: #34C759; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bubble-left { background-color: #252528; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        /* Bouncing Dots Typing Animation */
        .typing-indicator { display: flex; align-items: center; gap: 4px; padding: 12px 16px; }
        .typing-dot { width: 7px; height: 7px; background-color: #a2a2a2; border-radius: 50%; animation: bounce 1.3s infinite ease-in-out; }
        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        /* Leaflet mini-map modifications */
        .leaflet-control-zoom, .leaflet-control-attribution { display: none !important; }
        .leaflet-container { background: #121212 !important; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-neutral-950">
    <div class="phone-frame">
        <!-- Dynamic Island -->
        <div class="dynamic-island pointer-events-none"></div>

        <!-- Top App Bar -->
        <header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-3xl border-b-[0.5px] border-outline-variant/30 flex justify-between items-center px-6 h-14 box-content pt-4">
            <div onclick="window.location.href='../emergency_settings/code.html'" class="flex items-center gap-1 text-primary active:opacity-70 transition-opacity cursor-pointer">
                <span class="material-symbols-outlined text-[28px]">chevron_left</span>
                <span class="font-body-lg text-[16px]">Back</span>
            </div>
            <div class="flex flex-col items-center mr-6">
                <div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center mb-0.5">
                    <span class="material-symbols-outlined text-[20px] text-on-surface">person</span>
                </div>
                <span id="header-contact-name" class="text-[11px] font-semibold text-on-surface">Sarah Miller</span>
            </div>
            <div class="text-primary active:opacity-70 transition-opacity cursor-pointer">
                <span class="material-symbols-outlined text-[22px]">info</span>
            </div>
        </header>

        <!-- Chat Canvas -->
        <main id="chat-messages" class="flex-1 overflow-y-auto px-4 pt-24 pb-20 flex flex-col gap-4">
            <div class="text-center py-2">
                <span id="chat-timestamp" class="text-[11px] font-semibold text-secondary uppercase tracking-widest">Today 9:41 AM</span>
            </div>
            
            <!-- Incoming Message -->
            <div class="message-bubble bubble-left">
                <p class="text-[15px] leading-snug">Are you okay? Where are you?</p>
            </div>

            <!-- Outgoing Live Location Message Container -->
            <div id="live-location-container" class="flex flex-col items-end gap-1 w-full">
                <div class="message-bubble bubble-right w-[270px] p-0 overflow-hidden shadow-lg border border-white/10 flex flex-col">
                    <!-- Map Preview Card -->
                    <div id="mini-map" class="h-44 w-full bg-neutral-900 overflow-hidden z-10"></div>
                    <!-- Message Text -->
                    <div class="p-3 bg-[#34C759]">
                        <p id="bubble-text" class="text-[14px] text-white leading-snug">
                            Emergency! Here is my live location: <a id="location-url" href="#" target="_blank" class="underline font-semibold break-all text-blue-100">Loading...</a>
                        </p>
                    </div>
                </div>
                <span id="delivered-status" class="text-[11px] text-white/40 pr-1">Sending...</span>
            </div>
        </main>

        <!-- Bottom Input Bar (iMessage Style) -->
        <footer class="fixed bottom-0 w-full z-50 bg-surface/80 backdrop-blur-3xl border-t-[0.5px] border-outline-variant/30 pb-safe">
            <form id="chat-form" onsubmit="handleSendMessage(event)" class="flex items-end gap-2 px-3 py-2 max-w-full">
                <button type="button" class="mb-1 p-1 text-primary active:scale-90 transition-transform">
                    <span class="material-symbols-outlined text-[26px]">add_circle</span>
                </button>
                <!-- Message Input Area -->
                <div class="flex-1 relative flex items-center bg-surface-container-low border border-outline-variant/30 rounded-[20px] min-h-[36px] px-3 py-1">
                    <input type="text" id="chat-input" placeholder="iMessage" class="flex-1 bg-transparent text-white border-0 outline-none text-[15px] focus:ring-0 p-0" />
                    <button type="submit" class="ml-2 w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center active:scale-90 transition-transform flex-shrink-0">
                        <span class="material-symbols-outlined text-[20px] font-bold" style="font-variation-settings: 'FILL' 1;">arrow_upward</span>
                    </button>
                </div>
            </form>
        </footer>

        <!-- Bottom Safe Area Indicator -->
        <div class="h-1.5 w-32 bg-white/30 mx-auto mb-2 rounded-full z-50 relative pointer-events-none"></div>
    </div>

    <!-- Leaflet & Message Actions -->
    <script>
        let map = null;
        let marker = null;
        let contactName = 'Sarah Miller';

        window.addEventListener('load', () => {
            contactName = localStorage.getItem('emergency_contact_name') || 'Sarah Miller';
            const messageTemplate = localStorage.getItem('emergency_message') || 'Emergency! Here is my live location:';
            
            // Update UI headers
            document.getElementById('header-contact-name').innerText = contactName;
            document.getElementById('chat-timestamp').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // Initialize Leaflet Map inside the bubble
            const savedGps = localStorage.getItem('last_known_gps');
            const pos = savedGps ? JSON.parse(savedGps) : { latitude: 37.7749, longitude: -122.4194 };
            const userCoords = [pos.latitude, pos.longitude];

            const locationLink = `https://maps.google.com/?q=${pos.latitude.toFixed(5)},${pos.longitude.toFixed(5)}`;
            document.getElementById('location-url').innerText = locationLink;
            document.getElementById('location-url').href = locationLink;
            document.getElementById('bubble-text').innerHTML = `${messageTemplate} <a href="${locationLink}" target="_blank" class="underline font-semibold break-all text-blue-100">${locationLink}</a>`;

            // Render Leaflet Dark Map in mini-map container
            map = L.map('mini-map', {
                center: userCoords,
                zoom: 14,
                zoomControl: false,
                dragging: false,
                touchZoom: false,
                scrollWheelZoom: false,
                doubleClickZoom: false
            });

            // CartoDB Dark Matter tiles
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: ''
            }).addTo(map);

            // Add glowing blue circle representing user
            marker = L.circle(userCoords, {
                color: '#007AFF',
                fillColor: '#007AFF',
                fillOpacity: 0.4,
                radius: 120
            }).addTo(map);

            // Mock sending animation
            const statusEl = document.getElementById('delivered-status');
            setTimeout(() => {
                statusEl.innerText = "Delivered";
            }, 1200);

            scrollToBottom();
        });

        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';

            // 1. Add user bubble to chat canvas
            const chatEl = document.getElementById('chat-messages');
            const userBubble = document.createElement('div');
            userBubble.className = 'message-bubble bubble-right';
            userBubble.innerHTML = `<p class="text-[15px] leading-snug">${escapeHtml(text)}</p>`;
            chatEl.appendChild(userBubble);

            const statusLabel = document.createElement('span');
            statusLabel.className = 'text-[11px] text-white/40 pr-1 self-end block -mt-3';
            statusLabel.innerText = 'Delivered';
            chatEl.appendChild(statusLabel);

            scrollToBottom();

            // 2. Play subtle tap vibration
            if (navigator.vibrate) navigator.vibrate(10);

            // 3. Trigger typing auto-reply after 2.5 seconds
            setTimeout(() => {
                showTypingIndicator();
            }, 1500);
        }

        function showTypingIndicator() {
            const chatEl = document.getElementById('chat-messages');
            
            // Check if typing indicator already exists
            if (document.getElementById('typing-bubble')) return;

            const typingBubble = document.createElement('div');
            typingBubble.id = 'typing-bubble';
            typingBubble.className = 'message-bubble bubble-left p-2 self-start flex items-center justify-center';
            typingBubble.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatEl.appendChild(typingBubble);
            scrollToBottom();

            // After 2.5 seconds, send the response
            setTimeout(() => {
                typingBubble.remove();
                sendAutoReply();
            }, 2500);
        }

        function sendAutoReply() {
            const chatEl = document.getElementById('chat-messages');
            const replies = [
                "I see your location now. The coordinates look real. Are you safe to talk?",
                "I am dialing the emergency services right now and passing them this link. Stay silent!",
                "Got it. I'm tracking your telemetry updates on the dashboard. Hold on, help is coming.",
                "I see you moving. Are you in a car? Send another signal if you can."
            ];

            const chosenReply = replies[Math.floor(Math.random() * replies.length)];
            
            const replyBubble = document.createElement('div');
            replyBubble.className = 'message-bubble bubble-left';
            replyBubble.innerHTML = `<p class="text-[15px] leading-snug">${escapeHtml(chosenReply)}</p>`;
            chatEl.appendChild(replyBubble);
            
            scrollToBottom();

            // Vibrate screen as notification alerts
            if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
        }

        function scrollToBottom() {
            const chatEl = document.getElementById('chat-messages');
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
