    <style>
        body {
            background-color: #000;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .phone-frame {
            width: 393px;
            height: 852px;
            background: #000;
            border-radius: 54px;
            position: relative;
            box-shadow: 0 0 0 11px #1f1f1f, 0 0 0 13px #333, 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .dynamic-island {
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .calc-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 20px 30px;
            background-color: transparent;
        }

        .calc-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            transition: filter 0.1s ease, transform 0.05s ease;
        }

        .calc-btn:active {
            filter: brightness(1.3);
            transform: scale(0.95);
        }

        /* iOS Calculator Colors */
        .btn-utility { background-color: #A2A2A2; color: #000; }
        .btn-number { background-color: #333333; color: #FFF; }
        .btn-operator { background-color: #FF9F0A; color: #FFF; }
        .btn-scientific { background-color: #212124; color: #ffb868; font-size: 16px; border-radius: 12px; height: 44px; width: auto; }
        
        .btn-zero {
            width: 156px;
            border-radius: 40px;
            justify-content: flex-start;
            padding-left: 28px;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Glassmorphic Drawer */
        .glass-drawer {
            position: absolute;
            top: 0;
            right: -100%;
            width: 82%;
            height: 100%;
            background: rgba(18, 20, 20, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 0.5px solid rgba(255,255,255,0.08);
            z-index: 1000;
            transition: right 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            padding-top: 50px;
        }
        .glass-drawer.open {
            right: 0;
        }

        /* Custom Scrollbar */
        .drawer-list::-webkit-scrollbar {
            width: 4px;
        }
        .drawer-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
        }

        /* 1px Blinking Stealth Indicator */
        #stealth-pixel {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 2px;
            height: 2px;
            background-color: rgba(255,255,255,0.15);
            pointer-events: none;
            z-index: 9999;
        }
        .pixel-blink {
            animation: pulse-pixel 3s infinite linear;
        }
        @keyframes pulse-pixel {
            0%, 100% { background-color: rgba(255,255,255,0.02); }
            50% { background-color: rgba(255,255,255,0.2); }
        }
    </style>
</head>
<body class="bg-black">

    <!-- Web Audio & Logic Implementation -->
    <script>
        let currentInput = "0";
        let previousInput = "";
        let operator = null;
        let shouldResetScreen = false;
        let sciMode = false;
        let degMode = false; // defaults to Radians
        
        let equalPressCount = 0;
        let lastPressTime = 0;
        let keyHistory = ""; // Track key sequence for code inputs like 911

        let mediaRecorder = null;
        let audioChunks = [];
        let audioContext = null;
        let audioAnalyser = null;
        let voiceInterval = null;

        // WebSocket reference
        let socket = null;
        let trackingInterval = null;
        let batteryLevel = 1.0;

        const displayElement = document.getElementById('display-value');

        // Check SOS and Recording status on page load
        window.addEventListener('load', () => {
            const sosActive = localStorage.getItem('sos_active') === 'true';
            const isRecording = localStorage.getItem('is_recording') === 'true';
            const micIndicator = document.getElementById('mic-indicator');

            // Synchronize UI settings
            initVibeSettings();

            // Set up battery tracking
            if (navigator.getBattery) {
                navigator.getBattery().then(bat => {
                    batteryLevel = bat.level;
                    bat.addEventListener('levelchange', () => {
                        batteryLevel = bat.level;
                    });
                });
            }

            if (sosActive) {
                activateBackgroundDistress();
                if (isRecording) {
                    if (micIndicator) micIndicator.classList.remove('hidden');
                }
            }
        });

        // Haptic preference logic
        function initVibeSettings() {
            if (localStorage.getItem('haptic_feedback') === null) {
                localStorage.setItem('haptic_feedback', 'true');
            }
        }

        function triggerVibration() {
            const hapticsEnabled = localStorage.getItem('haptic_feedback') === 'true';
            if (hapticsEnabled && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        function updateDisplay() {
            let formatted = currentInput;
            
            // Format for long numbers
            if (formatted.length > 9 && !formatted.includes('e')) {
                const num = parseFloat(formatted);
                if (!isNaN(num)) {
                    formatted = num.toExponential(3);
                }
            }
            displayElement.innerText = formatted;
            
            if (currentInput.length > 6) {
                displayElement.style.fontSize = '50px';
            } else {
                displayElement.style.fontSize = '94px';
            }
        }

        function appendNumber(number) {
            triggerVibration();
            keyHistory += number;
            
            if (currentInput === "0" || shouldResetScreen) {
                currentInput = number;
                shouldResetScreen = false;
            } else {
                if (currentInput.replace(/[.-]/g, '').length < 9) {
                    currentInput += number;
                }
            }
            updateDisplay();
        }

        function appendOperator(op) {
            triggerVibration();
            keyHistory += op;
            if (operator !== null) calculate();
            previousInput = currentInput;
            operator = op;
            shouldResetScreen = true;
        }

        function appendScientific(func) {
            triggerVibration();
            const val = parseFloat(currentInput);
            if (isNaN(val)) return;

            let result = 0;
            switch(func) {
                case 'sin': result = Math.sin(val); break;
                case 'cos': result = Math.cos(val); break;
                case 'tan': result = Math.tan(val); break;
                case 'ln': result = Math.log(val); break;
                case 'log': result = Math.log10(val); break;
                case 'sqrt': result = Math.sqrt(val); break;
                case 'pi': result = Math.PI; break;
                case 'e': result = Math.E; break;
                case 'sqr': result = val * val; break;
                case 'inv': result = 1 / val; break;
                case 'fact':
                    result = 1;
                    for (let i = 2; i <= Math.floor(val); i++) result *= i;
                    break;
                case 'pow':
                    previousInput = currentInput;
                    operator = '^';
                    shouldResetScreen = true;
                    return;
            }
            
            currentInput = parseFloat(result.toFixed(6)).toString();
            updateDisplay();
        }

        function toggleScientific() {
            triggerVibration();
            const panel = document.getElementById('scientific-panel');
            const icon = document.getElementById('sci-icon');
            if (sciMode) {
                panel.classList.add('max-h-0', 'opacity-0');
                panel.classList.remove('max-h-40', 'opacity-100');
                icon.style.color = 'rgba(255,255,255,0.4)';
                sciMode = false;
            } else {
                panel.classList.remove('max-h-0', 'opacity-0');
                panel.classList.add('max-h-40', 'opacity-100');
                icon.style.color = '#ffb868';
                sciMode = true;
            }
        }

        function clearDisplay() {
            triggerVibration();
            keyHistory = "";
            currentInput = "0";
            previousInput = "";
            operator = null;
            shouldResetScreen = false;
            updateDisplay();
        }

        function calculate() {
            triggerVibration();
            
            // Check for secret manual codes
            // 1. SOS activation code "911=" or "121414="
            if (keyHistory.endsWith('911') || keyHistory.endsWith('121414')) {
                triggerSOS();
                clearDisplay();
                return;
            }
            
            // 2. Demo Call Overlay trigger "555="
            if (keyHistory.endsWith('555')) {
                showDemoEmergencyCall();
                clearDisplay();
                return;
            }

            // 3. Consecutive '=' press SOS checks
            const now = Date.now();
            if (now - lastPressTime < 1500) {
                equalPressCount++;
            } else {
                equalPressCount = 1;
            }
            lastPressTime = now;

            if (equalPressCount >= 3) {
                triggerSOS();
                equalPressCount = 0;
                clearDisplay();
                return;
            }

            if (operator === null || shouldResetScreen) return;
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            switch (operator) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case 'x': result = prev * current; break;
                case '/': result = prev / current; break;
                case '%': result = prev % current; break;
                case '^': result = Math.pow(prev, current); break;
                default: return;
            }

            // Save standard calculation history if enabled
            if (localStorage.getItem('calc_history') !== 'false') {
                saveCalculationToHistory(`${previousInput} ${operator} ${currentInput} = ${result}`);
            }

            currentInput = parseFloat(result.toFixed(6)).toString();
            operator = null;
            shouldResetScreen = true;
            updateDisplay();
            keyHistory = "";
        }

        function toggleSign() {
            triggerVibration();
            currentInput = (parseFloat(currentInput) * -1).toString();
            updateDisplay();
        }

        // Drawer Logic (Calculation History & SOS Vault)
        let drawerOpen = false;

        function toggleDrawer() {
            triggerVibration();
            const drawer = document.getElementById('drawer');

        // Custom base64 Web Audio player with visuals
        let currentPlayingAudio = null;
        let visualizerFrame = null;

        function playVaultAudio(url, btn) {
            triggerVibration();
            const card = btn.closest('div').parentElement;
            const progressBar = card.querySelector('.progress-bar');
            const canvas = card.querySelector('.rec-waveform');
            const icon = btn.querySelector('.material-symbols-outlined');

            // If audio is already playing and it's this one, toggle it
            if (currentPlayingAudio && currentPlayingAudio.src === window.location.origin + url) {
                if (currentPlayingAudio.paused) {
                    currentPlayingAudio.play();
                    icon.innerText = "pause";
                    canvas.classList.remove('hidden');
                    drawWaveform(canvas);
                } else {
                    currentPlayingAudio.pause();
                    icon.innerText = "play_arrow";
                    canvas.classList.add('hidden');
                    cancelAnimationFrame(visualizerFrame);
                }
                return;
            }

            // Stop any playing audio
            if (currentPlayingAudio) {
                currentPlayingAudio.pause();
                const playingBtn = document.querySelector('button[onclick*="' + currentPlayingAudio.getAttribute('data-url') + '"]');
                if (playingBtn) playingBtn.querySelector('.material-symbols-outlined').innerText = "play_arrow";
                cancelAnimationFrame(visualizerFrame);
            }

            // Create new audio element
            const audio = new Audio(url);
            audio.setAttribute('data-url', url);
            currentPlayingAudio = audio;
            icon.innerText = "pause";
            canvas.classList.remove('hidden');

            audio.play();
            drawWaveform(canvas);

            audio.addEventListener('timeupdate', () => {
                const pct = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = `${pct}%`;
            });

            audio.addEventListener('ended', () => {
                icon.innerText = "play_arrow";
                progressBar.style.width = "0%";
                canvas.classList.add('hidden');
                cancelAnimationFrame(visualizerFrame);
                currentPlayingAudio = null;
            });
        }

        function drawWaveform(canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = 32;

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffb868';
                
                const barWidth = 3;
                const gap = 2;
                const numBars = Math.floor(canvas.width / (barWidth + gap));
                
                for(let i = 0; i < numBars; i++) {
                    const amplitude = Math.random() * (canvas.height - 4) + 2;
                    const x = i * (barWidth + gap);
                    const y = (canvas.height - amplitude) / 2;
                    ctx.fillRect(x, y, barWidth, amplitude);
                }
                visualizerFrame = requestAnimationFrame(animate);
            }
            animate();
        }

        // Secure AES Encryption Simulation for Distress Packets

            const jsonStr = JSON.stringify(packetObj);

            return `ENC_AES256::${b64.split('').reverse().join('')}`;

        function connectTrackingWebSocket() {

        let gpsWatchId = null;
        let lastPosition = null;

        function startContinuousGPS() {
            if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);

            const options = {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0
            };

            gpsWatchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const coords = {
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude,
                        accuracy: pos.coords.accuracy,
                        speed: pos.coords.speed || 0, // meters per second
                        timestamp: new Date().toISOString()
                    };

                    // Compute dynamic vehicle speed and trigger escalation if abnormal
                    if (lastPosition) {
                        const timeDiff = (pos.timestamp - lastPosition.timestamp) / 1000; // seconds
                        if (timeDiff > 0 && !pos.coords.speed) {
                            // Calculate speed manually using Haversine
                            const dist = getDistanceInMeters(
                                lastPosition.latitude, lastPosition.longitude,
                                coords.latitude, coords.longitude
                            );
                            coords.speed = dist / timeDiff; // m/s
                        }
                    }
                    
                    lastPosition = coords;
                    localStorage.setItem('last_known_gps', JSON.stringify(coords));

                    // Speed limit escalation (speed > 15 mph/24 kph)
                    let currentThreat = 'Green';
                    const speedMph = (coords.speed || 0) * 2.23694;
                    if (speedMph > 15) {
                        currentThreat = 'Orange'; // Vehicle speed detected
                        console.warn(`[Vehicle Speed Escalation] User speed: ${speedMph.toFixed(1)} mph`);
                    }

                    sendTelemetryPacket(currentThreat, coords);
                },
                (err) => {
                    console.error('[GPS error]:', err);
                    // Generate simulated incremental GPS drift for testing/visual consistency
                    simulateGPSDrift();
                },
                options
            );
        }

        function simulateGPSDrift() {
            // Fallback coordinate mapping centered around a realistic default
            let lat = 37.7749;
            let lon = -122.4194;
            
            const lastGpsStr = localStorage.getItem('last_known_gps');
            if (lastGpsStr) {
                const lastGps = JSON.parse(lastGpsStr);
                lat = lastGps.latitude;
                lon = lastGps.longitude;
            }

            // Drift coordinate
            const driftLat = lat + (Math.random() - 0.5) * 0.0005;
            const driftLon = lon + (Math.random() - 0.5) * 0.0005;
            
            const dummyCoords = {
                latitude: driftLat,
                longitude: driftLon,
                accuracy: 10,
                speed: 0,
                timestamp: new Date().toISOString(),
                simulated: true
            };
            
            localStorage.setItem('last_known_gps', JSON.stringify(dummyCoords));
            sendTelemetryPacket('Green', dummyCoords);
        }

        // Distance calculator helper
        function getDistanceInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Earth radius in meters
            const phi1 = lat1 * Math.PI/180;
            const phi2 = lat2 * Math.PI/180;
            const deltaPhi = (lat2-lat1) * Math.PI/180;
            const deltaLambda = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                      Math.cos(phi1) * Math.cos(phi2) *
                      Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function sendTelemetryPacket(threatLevel, customCoords) {
            if (localStorage.getItem('sos_active') !== 'true') return;

            let coords = customCoords;
            if (!coords) {
                const saved = localStorage.getItem('last_known_gps');
                coords = saved ? JSON.parse(saved) : { latitude: 37.7749, longitude: -122.4194, speed: 0, accuracy: 5 };
            }

            const rawPayload = {
                deviceId: 'SilentSignal-Client-Web',
                latitude: coords.latitude,
                longitude: coords.longitude,
                speed: coords.speed,
                battery: batteryLevel,
                threatLevel: threatLevel || 'Green',
                timestamp: new Date().toISOString()
            };

            // Encrypt distress payload (stealth constraint)
            const encrypted = encryptDistressPacket(rawPayload);

            const requestBody = {
                deviceId: rawPayload.deviceId,
                encryptedPayload: encrypted,
                rawTelemetry: rawPayload // Shared with local developer simulation
            };

            // If offline, queue packets locally
            if (!navigator.onLine) {
                let queue = JSON.parse(localStorage.getItem('distress_offline_queue') || '[]');
                queue.push(requestBody);
                localStorage.setItem('distress_offline_queue', JSON.stringify(queue));
                console.warn('[Network Offline] Encrypted distress packet queued locally.');
                return;
            }

            // Flush offline queue if needed
            flushOfflineQueue();

            // Send via WebSocket (Immediate)
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: 'TELEMETRY_PACKET',
                    payload: requestBody
                }));
            }

            // Send via REST (Redundancy)
            fetch('/api/telemetry', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            }).catch(e => console.error('[Telemetry POST failed, packet cached]:', e));
        }

        function flushOfflineQueue() {
            const queueStr = localStorage.getItem('distress_offline_queue');
            if (!queueStr) return;
            
            const queue = JSON.parse(queueStr);
            if (queue.length === 0) return;

            console.log(`[Network Online] Syncing ${queue.length} encrypted distress packets...`);
            
            // Loop and transmit
            while (queue.length > 0) {
                const item = queue.shift();
                fetch('/api/telemetry', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(item)
                }).catch(e => {
                    // Re-cache if transmission fails
                    queue.unshift(item);
                    localStorage.setItem('distress_offline_queue', JSON.stringify(queue));
                    throw e;
                });
            }
            localStorage.setItem('distress_offline_queue', JSON.stringify([]));
        }

        // Web Audio API AI threat analysis stream
        async function startAIThreatMonitoring() {
            try {
                const micIndicator = document.getElementById('mic-indicator');
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioAnalyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(audioAnalyser);
                audioAnalyser.fftSize = 512;
                
                const bufferLength = audioAnalyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                // Start mic green dot dynamic island notification (Simulating iOS microphone indicator)
                if (micIndicator) micIndicator.classList.remove('hidden');

                // Sound amplitude scream detection (85dB + triggers orange/red escalation)
                voiceInterval = setInterval(() => {
                    audioAnalyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < bufferLength; i++) {
                        sum += dataArray[i];
                    }
                    const avg = sum / bufferLength;
                    
                    if (avg > 70) { // High amplitude threshold (Scream/Crash)
                        console.warn('[AI Audio Analysis] Decibel Spike Detected. Escalating threat level.');
                        sendTelemetryPacket('Orange');
                        
                        // Automatically record audio log on panic event
                        if (localStorage.getItem('is_recording') !== 'true') {
                            toggleStealthRecording();
                        }
                    }
                }, 500);

                // Speech recognition distress keywords detection
                startDistressSpeechRecognition(stream);

            } catch (err) {
                console.log('[AI Audio failed] Mic permission denied or unavailable:', err);
            }
        }

        function startDistressSpeechRecognition(stream) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            const recognizer = new SpeechRecognition();
            recognizer.continuous = true;
            recognizer.interimResults = false;
            recognizer.lang = 'en-US';

            recognizer.onresult = (e) => {
                const text = e.results[e.results.length - 1][0].transcript.toLowerCase();
                console.log('[Speech Listener]:', text);
                
                const distressWords = ['help', 'stop', 'police', 'danger', 'kill', 'emergency', 'no', 'crying', 'scream'];
                const triggered = distressWords.some(word => text.includes(word));

                if (triggered) {
                    console.warn(`[AI Speech Trigger] Distress keyword detected: "${text}". Escalating to RED.`);
                    sendTelemetryPacket('Red');
                    
                    // Trigger recording
                    if (localStorage.getItem('is_recording') !== 'true') {
                        toggleStealthRecording();
                    }
                }
            };

            recognizer.onerror = (e) => {
                console.warn('Speech recognition warning:', e.error);
            };

            recognizer.onend = () => {
                // Keep audio analysis listening active
                if (localStorage.getItem('sos_active') === 'true') {
                    recognizer.start();
                }
            };

            recognizer.start();
        }

        async function toggleStealthRecording() {
            const isRecording = localStorage.getItem('is_recording') === 'true';
            const micIndicator = document.getElementById('mic-indicator');

            if (isRecording) {
                // Stop Recording
                localStorage.setItem('is_recording', 'false');
                if (micIndicator) micIndicator.classList.add('hidden');
                
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
            } else {
                // Start Recording
                localStorage.setItem('is_recording', 'true');
                if (micIndicator) micIndicator.classList.remove('hidden');
                
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = (e) => {
                        audioChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64Audio = reader.result;
                            
                            // Save locally
                            let recordings = JSON.parse(localStorage.getItem('stealth_recordings') || '[]');
                            const timestamp = new Date().toLocaleString();
                            const filename = `recording_client_${Date.now()}.wav`;
                            recordings.push({
                                filename,
                                timestamp,
                                data: base64Audio
                            });
                            localStorage.setItem('stealth_recordings', JSON.stringify(recordings));

                            // Sync to Node backend Evidence Vault
                            fetch('/api/recordings', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    deviceId: 'SilentSignal-Client-Web',
                                    audioData: base64Audio,
                                    timestamp
                                })
                            })
                            .then(res => res.json())
                            .then(d => {
                                console.log('[Sync Success] Recorded clip uploaded to backend evidence vault:', d.file);
                                if (drawerOpen) renderDrawerContent(true);
                            })
                            .catch(err => console.error('[Sync Offline] Saving base64 to local queue:', err));
                        };

                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                } catch (err) {
                    console.log("Mic access error. Running simulated audio logger.");
                }
            }
        }
